services:
  postgres:
    image: postgres:16-alpine
    container_name: devcodehub-postgres
    # 값은 같은 폴더의 .env에서 읽음 (.env.example 참고). 비밀번호를 저장소에 남기지 않기 위함
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?infra/.env에 POSTGRES_PASSWORD를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-devcodehub}
    ports:
      - "5432:5432"
    volumes:
      # [Why] WSL에서 /mnt/d 같은 Windows 드라이브를 데이터 폴더로 연결하면 Postgres가 권한 변경(chmod)에 실패해 뜨지 않는다.
      # Docker 볼륨은 Linux 파일시스템에 저장되어 어느 환경에서나 동작한다. `docker compose down -v`를 하면 데이터도 삭제된다.
      - devcodehub_pgdata:/var/lib/postgresql/data

volumes:
  devcodehub_pgdata:
