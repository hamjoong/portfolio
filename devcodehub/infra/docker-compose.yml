services:
  postgres:
    image: postgres:16-alpine
    container_name: devcodehub-postgres
    # 값은 같은 폴더의 .env에서 읽음 (.env.example 참고). 비밀번호를 저장소에 남기지 않기 위함
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?infra/.env에 POSTGRES_PASSWORD를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-devcodehub}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: devcodehub-redis
    ports:
      - "6379:6379"
