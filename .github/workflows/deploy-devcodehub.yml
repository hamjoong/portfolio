name: Deploy DevCodeHub

# 프론트엔드(Vercel) · 백엔드(Render) 중 바뀐 쪽만 검증 후 배포한다. DB 파일(backend/db/**)만 바뀌면 아무것도 배포하지 않는다.
# 필요한 Secrets: DEVCODEHUB_VERCEL_TOKEN, DEVCODEHUB_VERCEL_PROJECT_ID, VERCEL_ORG_ID(shoppingmall과 공용), RENDER_DEPLOY_HOOK_URL
# 두 플랫폼 모두 자체 Git 자동 배포는 꺼 둔다(이 워크플로만 배포하도록, 이중 배포 방지).
# 수동 실행(workflow_dispatch)은 프론트·백엔드를 모두 배포한다.
on:
  push:
    branches:
      - main
    paths:
      - 'devcodehub/backend/**'
      - '!devcodehub/backend/db/**'
      - 'devcodehub/frontend/**'
      - '.github/workflows/deploy-devcodehub.yml'
  workflow_dispatch:

permissions:
  contents: read

# 연속 push 때 배포가 겹치지 않게 순서대로 실행한다.
concurrency:
  group: devcodehub-deploy
  cancel-in-progress: false

jobs:
  # 1. 변경된 경로 감지
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 수동 실행은 비교할 기준이 없으므로 둘 다 true로 처리한다.
          filters: |
            backend:
              - 'devcodehub/backend/**'
              - '!devcodehub/backend/db/**'
            frontend:
              - 'devcodehub/frontend/**'

  # 2. 백엔드: 테스트 통과 후 Render에 배포 요청
  backend-verify:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test
        working-directory: devcodehub/backend
        # mvnw의 실행 권한이 Git에 기록돼 있지 않아(윈도우 드라이브에서 작업) bash로 직접 실행한다.
        run: bash ./mvnw -B test

  backend-deploy:
    needs: backend-verify
    runs-on: ubuntu-latest
    steps:
      # Render가 저장소를 받아 Docker 이미지를 직접 빌드하므로 여기서는 요청만 보낸다.
      - name: Trigger Render deploy
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  # 3. 프론트엔드: lint·타입·빌드 통과 후 Vercel에 배포
  frontend-verify:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: devcodehub/frontend/package-lock.json

      - name: Install dependencies
        working-directory: devcodehub/frontend
        run: npm ci

      - name: Lint
        working-directory: devcodehub/frontend
        run: npm run lint

      # 빌드 검증용이다. 실제 주소와 키는 Vercel 환경변수에서 쓴다.
      - name: Build
        working-directory: devcodehub/frontend
        run: npm run build

  frontend-deploy:
    needs: frontend-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vercel이 자기 서버에서 설치·빌드한다. Vercel 프로젝트의 Root Directory는 devcodehub/frontend로 지정한다.
      # shoppingmall과 같은 이유로 액션 대신 CLI를 직접 쓴다(프로젝트 범위 토큰이 사용자 조회에서 거부되는 문제).
      - name: Deploy to Vercel
        run: npx --yes vercel@62 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.DEVCODEHUB_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.DEVCODEHUB_VERCEL_ORG_ID }}
          # shoppingmall이 같은 저장소에서 VERCEL_PROJECT_ID를 이미 쓰므로 이름을 구분한다.
          VERCEL_PROJECT_ID: ${{ secrets.DEVCODEHUB_VERCEL_PROJECT_ID }}
