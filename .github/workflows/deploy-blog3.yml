name: Deploy Blog3 to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'blog3/**'

# gh-pages 브랜치에 배포 결과를 쓰려면 쓰기 권한이 필요하다. 새 저장소의 GITHUB_TOKEN 기본값은 읽기 전용이다.
permissions:
  contents: write

# blog3와 milktycoon은 같은 gh-pages 브랜치에 배포하므로, 두 워크플로가 동시에 실행되어 충돌하지 않게 같은 그룹으로 묶는다.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: blog3

      - name: Build
        run: npm run build
        working-directory: blog3

      # GitHub Pages 배포
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./blog3/dist
          destination_dir: blog3
          force_orphan: false
